name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

  # This tool hardcodes the retirement deadlines and branches on the current date, so a
  # test can pass the day it is written and start failing later without a commit to blame.
  # That is not hypothetical: crossing 2026-09-01 broke the sample-reproducibility check,
  # and nothing said so until somebody happened to run the suite by hand. A weekly run
  # surfaces that within days of the calendar causing it.
  #
  # Offset from the hour because scheduled workflows queue against everyone else's, and
  # the top of the hour is the worst of it. GitHub disables the schedule after 60 days
  # with no repository activity; a push re-enables it.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  checks:
    # Both legs run tools/Invoke-Checks.ps1, the same command contributors and the
    # pre-push hook run, so CI cannot drift from the local definition of green.
    # Windows is a leg in its own right, not a courtesy: the operator runs this tool
    # there, and Protect-OutputFile's NTFS ACL path is only exercised on Windows.
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Cache PowerShell modules
        uses: actions/cache@v6
        with:
          # CurrentUser module path differs per OS.
          path: ${{ runner.os == 'Windows' && '~/Documents/PowerShell/Modules' || '~/.local/share/powershell/Modules' }}
          key: psmodules-checks-${{ runner.os }}-v1

      - name: Install modules
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Run checks
        run: ./tools/Invoke-Checks.ps1 -TestResultPath ./testResults.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results-${{ matrix.os }}
          path: testResults.xml
