name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-analyzer-${{ runner.os }}-v1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }

      - name: Analyze
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse `
              -Settings ./PSScriptAnalyzerSettings.psd1
          if ($findings) {
              $findings | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host
              # Annotate the diff so findings land on the changed lines in the PR.
              foreach ($f in $findings) {
                  $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
                  "::$level file=$($f.ScriptPath -replace [regex]::Escape($PWD.Path + '/')),line=$($f.Line)::$($f.RuleName): $($f.Message)"
              }
              throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          Write-Host 'No findings.'

  test:
    name: Pester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-pester-${{ runner.os }}-v1

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
              Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          }

      - name: Run tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: ./testResults.xml
          if-no-files-found: warn
